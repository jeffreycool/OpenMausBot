# Minimal repro for the Windows CUA staging failure (agentchat-winfix).
# Downloads the pinned cua-driver zip with zero repo tooling, extracts it,
# and reports which files survive and what Defender says. Tag-triggered:
# the fork runs workflows found on the pushed ref.
name: CUA Windows probe

on:
  push:
    tags:
      - "cua-probe-*"

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: A/B the extractors on the same zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $base = "$env:RUNNER_TEMP\ab"
          $url = 'https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.45.4/cua-driver-rs-0.45.4-windows-x86_64-binary.zip'
          New-Item -ItemType Directory -Force "$base\zip" | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$base\zip\cua.zip" -UserAgent 'probe'
          Write-Host "=== A: powershell.exe 5.1 Expand-Archive (script's exact invocation) ==="
          $a = "$base\out-ps51"
          New-Item -ItemType Directory -Force $a | Out-Null
          $p1 = Start-Process -FilePath powershell.exe -ArgumentList '-NoProfile','-NonInteractive','-Command','Expand-Archive -LiteralPath $env:PROBE_ARCHIVE -DestinationPath $env:PROBE_OUT' -NoNewWindow -PassThru -Wait -Environment @{PROBE_ARCHIVE="$base\zip\cua.zip"; PROBE_OUT=$a}
          Write-Host "ps5.1 exit=$($p1.ExitCode)"
          Get-ChildItem $a -ErrorAction Continue | Select-Object Name,Length | Out-String
          Write-Host "=== A2: ps5.1 direct (no env indirection) ==="
          $a2 = "$base\out-ps51b"
          New-Item -ItemType Directory -Force $a2 | Out-Null
          $p2 = Start-Process -FilePath powershell.exe -ArgumentList '-NoProfile','-NonInteractive','-Command',"Expand-Archive -LiteralPath '$base\zip\cua.zip' -DestinationPath '$a2' -Force" -NoNewWindow -PassThru -Wait
          Write-Host "ps5.1 direct exit=$($p2.ExitCode)"
          Get-ChildItem $a2 -ErrorAction Continue | Select-Object Name,Length | Out-String
          Write-Host "=== B: tar.exe ==="
          $b = "$base\out-tar"
          New-Item -ItemType Directory -Force $b | Out-Null
          $tar = Start-Process -FilePath "$env:SystemRoot\System32\tar.exe" -ArgumentList '-xf',"$base\zip\cua.zip",'-C',$b -NoNewWindow -PassThru -Wait
          Write-Host "tar exit=$($tar.ExitCode)"
          Get-ChildItem $b -ErrorAction Continue | Select-Object Name,Length | Out-String
          Write-Host "=== PS 5.1 version info ==="
          powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable | Out-String'
          Write-Host "=== PS 5.1 module state ==="
          powershell.exe -NoProfile -NonInteractive -Command 'Get-Module -ListAvailable Microsoft.PowerShell.Archive | Format-List Name,Version,Path | Out-String; $env:PSModulePath'
          Write-Host "=== node execFile replication (how the script actually calls it) ==="
          node -e "const{execFile}=require('child_process');const{promisify}=require('util');const run=promisify(execFile);run('powershell.exe',['-NoProfile','-NonInteractive','-Command','Expand-Archive -LiteralPath $env:OMB_CUA_ARCHIVE -DestinationPath $env:OMB_CUA_EXTRACT'],{env:{...process.env,OMB_CUA_ARCHIVE:process.argv[1]+String.raw`\zip\cua.zip`,OMB_CUA_EXTRACT:process.argv[2]},timeout:60000,windowsHide:true}).then(r=>console.log('node-ps exit ok',r.stderr)).catch(e=>{console.log('node-ps FAILED code',e.code);console.log(String(e.stderr||e.message).slice(0,500))}).then(async()=>{const fs=require('fs');console.log('dir:',fs.readdirSync(process.argv[2]))})" "$base" "$base\out-node"

